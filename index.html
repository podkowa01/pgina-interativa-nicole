<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Granja Podkowa</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>

<h1>🐷 Granja Podkowa</h1>

<p>Do nascimento até o abate</p>

</header>

<div class="login">

<h2>Login</h2>

<input type="text" placeholder="Usuário">

<input type="password" placeholder="Senha">

<button class="entrar">Entrar</button>

</div>

<section class="menu">

<button onclick="mostrar('chegada')">
🐷 Chegada dos Leitões
</button>

<button onclick="mostrar('creche')">
🏠 Saída para a Creche
</button>

<button onclick="mostrar('abate')">
🚛 Saída para o Abate
</button>

</section>

<section id="conteudo">

<img id="imagem"
src="https://images.unsplash.com/photo-1516467508483-a7212febe31a?w=800"
alt="Granja">

<h2>Bem-vindo!</h2>

<p>
Clique em um dos botões acima para visualizar
as informações de cada etapa.
</p>

</section>

<footer>

© 2026 Granja Podkowa

</footer>

<script src="script.js"></script>

</body>
</html>
